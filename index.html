<div id="pwa-install-container" style="position:fixed; bottom:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:10px; align-items:flex-end;">
  <div id="pwa-bubble" style="display:none; background:#101010; border:1px solid rgba(212,175,55,0.3); color:#fff; padding:12px 16px; border-radius:16px; font-size:13px; max-width:240px; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
    <div style="font-weight:800; color:#d4af37; margin-bottom:4px;">📲 Instale nosso app!</div>
    <div style="opacity:0.8; font-size:12px; line-height:1.3;">Acesso rápido, sem precisar abrir navegador. Funciona offline!</div>
  </div>
  <button id="pwa-install-btn" style="width:64px; height:64px; border-radius:20px; background:linear-gradient(135deg,#f5d76e,#d4af37); border:none; box-shadow:0 8px 24px rgba(212,175,55,0.4); display:grid; place-items:center; cursor:pointer; transition:transform .2s; position:relative;">
    <span style="font-size:28px;">📲</span>
    <span style="position:absolute; top:-4px; right:-4px; width:18px; height:18px; background:#ff3b30; border-radius:50%; border:2px solid #050505; display:grid; place-items:center; font-size:10px; font-weight:900; color:#fff;">!</span>
  </button>
</div>
<script>
// PWA Install Logic
let deferredPrompt = null;
const installBtn = document.getElementById('pwa-install-btn');
const bubble = document.getElementById('pwa-bubble');
const container = document.getElementById('pwa-install-container');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  bubble.style.display = 'block';
  setTimeout(()=>{ bubble.style.display='none'; }, 6000);
});

installBtn.addEventListener('click', async () => {
  if(deferredPrompt){
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if(outcome==='accepted'){ bubble.innerHTML='<div style=\"font-weight:800;color:#d4af37\">✅ App instalado!</div><div style=\"opacity:0.8;font-size:12px;\">Obrigado por instalar!</div>'; bubble.style.display='block'; setTimeout(()=>container.style.display='none', 2000); }
    deferredPrompt=null;
  } else {
    // Fallback instructions
    bubble.innerHTML='<div style=\"font-weight:800;color:#d4af37;margin-bottom:4px;\">📲 Como instalar:</div><div style=\"opacity:0.8;font-size:12px;line-height:1.4;\">No Chrome: clique nos 3 pontinhos > Instalar app<br>No iPhone: Compartilhar > Adicionar à Tela de Início</div>';
    bubble.style.display='block';
    if(navigator.share){
      try{ await navigator.share({title:'Sousa Montagens', text:'Instale o app Sousa Montagens', url: window.location.href}); }catch{}
    }
  }
});

// Hide if already installed
window.addEventListener('appinstalled', () => { container.style.display='none'; });

// Auto hide bubble after 8s
setTimeout(()=>{ if(bubble) bubble.style.display='none'; }, 8000);

// Pulse animation
installBtn.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}], {duration:1200, iterations:Infinity, easing:'ease-in-out'});
</script>

<script>if("serviceWorker" in navigator){ navigator.serviceWorker.register("/sw.js").catch(()=>{}); }</script>
</body>
